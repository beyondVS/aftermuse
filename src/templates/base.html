{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AfterMuse{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script defer src="{% static 'vendor/htmx.min.js' %}"></script>
    <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
    <script defer src="{% static 'js/app.js' %}"></script>
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="{% url 'home' %}">
          <span class="brand-symbol" aria-hidden="true">A</span>
          AfterMuse
          <span class="brand-badge">Journal</span>
        </a>
        <nav aria-label="주 메뉴">
          <a href="{% url 'books:search' %}" class="nav-search-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="15" height="15">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
            </svg>
            <span>도서 검색</span>
          </a>
          {% if user.is_authenticated %}
            <form method="post" action="{% url 'accounts:logout' %}">
              {% csrf_token %}
              <button type="submit" class="btn-ghost">로그아웃</button>
            </form>
          {% else %}
            <a href="{% url 'accounts:login' %}">로그인</a>
            <a href="{% url 'accounts:signup' %}" class="btn btn-sm">시작하기</a>
          {% endif %}
        </nav>
      </div>
    </header>
    {% if messages %}
      <div class="messages" aria-live="polite">
        {% for message in messages %}<p>{{ message }}</p>{% endfor %}
      </div>
    {% endif %}
    <main id="main-content" class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
