<section id="interview-turn-region" role="alert" tabindex="-1" data-interview-focus autofocus>
  <p>다음 질문을 준비하지 못했습니다. 작성한 답변은 저장되어 있습니다.</p>
  <form method="post" action="{% url 'reflections:next_turn' turn.interview_id turn.sequence %}" hx-post="{% url 'reflections:next_turn' turn.interview_id turn.sequence %}" hx-target="#interview-turn-region" hx-swap="outerHTML">
    {% csrf_token %}
    <button type="submit">다음 질문 다시 준비하기</button>
  </form>
</section>
